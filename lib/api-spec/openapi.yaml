components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # Dashboard
    DashboardStats:
      type: object
      required: [totalStories, totalCampaigns, totalEvidence, totalAssets, totalKnowledge, storiesByStatus, activeCampaigns]
      properties:
        totalStories:
          type: number
        totalCampaigns:
          type: number
        totalEvidence:
          type: number
        totalAssets:
          type: number
        totalKnowledge:
          type: number
        activeCampaigns:
          type: number
        storiesByStatus:
          type: array
          items:
            $ref: "#/components/schemas/StatusCount"

    StatusCount:
      type: object
      required: [status, count]
      properties:
        status:
          type: string
        count:
          type: number

    ActivityItem:
      type: object
      required: [id, entityType, entityId, entityTitle, action, createdAt]
      properties:
        id:
          type: number
        entityType:
          type: string
        entityId:
          type: number
        entityTitle:
          type: string
        action:
          type: string
        createdAt:
          type: string
          format: date-time

    # Workspaces
    Workspace:
      type: object
      required: [id, name, slug, status, purpose, owner, tags, repositoryLinks, preferredExportFormats, knowledgeDomains, isFavorite, isPinned, createdAt, updatedAt]
      properties:
        id:
          type: number
        name:
          type: string
        slug:
          type: string
        description:
          type: ["string", "null"]
        color:
          type: ["string", "null"]
        status:
          type: string
          enum: [Active, Archived, Corrupted]
        purpose:
          type: string
          enum: [Product, Marketing, Research, Internal, Personal, Other]
        brand:
          type: ["string", "null"]
        writingVoice:
          type: ["string", "null"]
        targetAudience:
          type: ["string", "null"]
        currentGoal:
          type: ["string", "null"]
        icon:
          type: ["string", "null"]
        logoPath:
          type: ["string", "null"]
        owner:
          type: string
        tags:
          type: array
          items:
            type: string
        repositoryLinks:
          type: array
          items:
            type: string
        preferredExportFormats:
          type: array
          items:
            type: string
        knowledgeDomains:
          type: array
          items:
            type: string
        isFavorite:
          type: boolean
        isPinned:
          type: boolean
        lastOpenedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    WorkspaceInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        color:
          type: string
        purpose:
          type: string
          enum: [Product, Marketing, Research, Internal, Personal, Other]
        brand:
          type: string
        writingVoice:
          type: string
        targetAudience:
          type: string
        currentGoal:
          type: string
        tags:
          type: array
          items:
            type: string
        repositoryLinks:
          type: array
          items:
            type: string
        preferredExportFormats:
          type: array
          items:
            type: string
        knowledgeDomains:
          type: array
          items:
            type: string

    WorkspacePatch:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: ["string", "null"]
        color:
          type: ["string", "null"]
        status:
          type: string
          enum: [Active, Archived, Corrupted]
        purpose:
          type: string
          enum: [Product, Marketing, Research, Internal, Personal, Other]
        brand:
          type: ["string", "null"]
        writingVoice:
          type: ["string", "null"]
        targetAudience:
          type: ["string", "null"]
        currentGoal:
          type: ["string", "null"]
        tags:
          type: array
          items:
            type: string
        repositoryLinks:
          type: array
          items:
            type: string
        preferredExportFormats:
          type: array
          items:
            type: string
        knowledgeDomains:
          type: array
          items:
            type: string
        isFavorite:
          type: boolean
        isPinned:
          type: boolean

    WorkspaceMetrics:
      type: object
      required: [stories, evidence, knowledge, campaigns, assets, exports]
      properties:
        stories:
          type: number
        evidence:
          type: number
        knowledge:
          type: number
        campaigns:
          type: number
        assets:
          type: number
        exports:
          type: number

    WorkspaceHealthComponent:
      type: object
      required: [key, label, score, applicable, explanation]
      properties:
        key:
          type: string
        label:
          type: string
        score:
          type: number
        applicable:
          type: boolean
        explanation:
          type: string

    WorkspaceHealth:
      type: object
      required: [score, insufficientData, components]
      properties:
        score:
          type: number
        insufficientData:
          type: boolean
        components:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceHealthComponent"

    WorkspaceSummary:
      allOf:
        - $ref: "#/components/schemas/Workspace"
        - type: object
          required: [metrics, health]
          properties:
            metrics:
              $ref: "#/components/schemas/WorkspaceMetrics"
            health:
              $ref: "#/components/schemas/WorkspaceHealth"

    WorkspaceOverview:
      allOf:
        - $ref: "#/components/schemas/WorkspaceSummary"
        - type: object
          required: [recentActivity]
          properties:
            recentActivity:
              type: array
              items:
                $ref: "#/components/schemas/ActivityItem"
            continueWorking:
              anyOf:
                - type: object
                  required: [id, title, status]
                  properties:
                    id:
                      type: number
                    title:
                      type: string
                    status:
                      type: string
                - type: "null"

    WorkspaceIntegrity:
      type: object
      required: [healthy, issues]
      properties:
        healthy:
          type: boolean
        issues:
          type: array
          items:
            type: string

    WorkspaceManifest:
      type: object
      required: [schemaVersion, exportedAt, workspace, metrics]
      properties:
        schemaVersion:
          type: number
        exportedAt:
          type: string
          format: date-time
        workspace:
          $ref: "#/components/schemas/Workspace"
        metrics:
          $ref: "#/components/schemas/WorkspaceMetrics"

    # Deprecated Projects
    Project:
      type: object
      required: [id, name, createdAt, updatedAt]
      properties:
        id:
          type: number
        name:
          type: string
        description:
          type: ["string", "null"]
        color:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ProjectInput:
      type: object
      required: [name]
