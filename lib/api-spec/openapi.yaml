openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: N-Tech C³ Engineering Intelligence Operating System API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: stories
    description: Story operations
  - name: campaigns
    description: Campaign operations
  - name: evidence
    description: Evidence vault operations
  - name: assets
    description: Asset library operations
  - name: knowledge
    description: Knowledge base operations
  - name: templates
    description: Template operations
  - name: projects
    description: Deprecated Project compatibility operations
  - name: workspaces
    description: Workspace operating-context operations
  - name: dashboard
    description: Dashboard and analytics operations
  - name: search
    description: Cross-module full-text search

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # Dashboard
  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get dashboard statistics
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Get recent activity feed
      responses:
        "200":
          description: Recent activity items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /search:
    get:
      operationId: globalSearch
      tags: [search]
      summary: Search all indexed engineering intelligence
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
        - name: limit
          in: query
          schema:
            type: number
            minimum: 1
            maximum: 50
            default: 20
        - name: entityType
          in: query
          schema:
            type: string
            enum: [story, evidence, knowledge, campaign, asset, template, workspace]
        - name: projectId
          in: query
          schema:
            type: number
        - name: status
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Ranked search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SearchResult"

  # Workspaces
  /workspaces:
    get:
      operationId: listWorkspaces
      tags: [workspaces]
      summary: List and filter workspaces
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [Active, Archived, Corrupted]
        - name: favorite
          in: query
          schema:
            type: boolean
        - name: pinned
          in: query
          schema:
            type: boolean
        - name: purpose
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Workspace summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkspaceSummary"
    post:
      operationId: createWorkspace
      tags: [workspaces]
      summary: Create a workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceInput"
      responses:
        "201":
          description: Created workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "409":
          description: Workspace slug already exists

  /workspaces/{workspaceId}:
    parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: number
    get:
      operationId: getWorkspace
      tags: [workspaces]
      summary: Get a workspace overview
      responses:
        "200":
          description: Workspace overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceOverview"
        "404":
          description: Not found
    patch:
      operationId: updateWorkspace
      tags: [workspaces]
      summary: Update workspace metadata or state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspacePatch"
      responses:
        "200":
          description: Updated workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "404":
          description: Not found
        "409":
          description: Archived workspace is read-only

  /workspaces/{workspaceId}/duplicate:
    post:
      operationId: duplicateWorkspace
      tags: [workspaces]
      summary: Duplicate workspace metadata and DNA
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: number
      responses:
        "201":
          description: Duplicated workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "404":
          description: Not found

  /workspaces/{workspaceId}/integrity:
    get:
      operationId: getWorkspaceIntegrity
      tags: [workspaces]
      summary: Check workspace referential integrity
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Integrity report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceIntegrity"
        "404":
          description: Not found

  /workspaces/{workspaceId}/export:
    get:
      operationId: exportWorkspace
      tags: [workspaces]
      summary: Export a versioned workspace manifest
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Workspace manifest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceManifest"
        "404":
          description: Not found

  # Deprecated Projects compatibility API
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List all projects
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Not found
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectPatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Not found
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  # Stories
  /stories:
    get:
      operationId: listStories
      tags: [stories]
      summary: List stories
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: campaignId
          in: query
          schema:
            type: ["number", "null"]
        - name: workspaceId
          in: query
          schema:
            type: number
        - name: storyType
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of stories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Story"
    post:
      operationId: createStory
      tags: [stories]
      summary: Create a story
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Story"

  /stories/{id}:
    get:
      operationId: getStory
      tags: [stories]
      summary: Get a story
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Story
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Story"
        "404":
          description: Not found
    patch:
      operationId: updateStory
      tags: [stories]
      summary: Update a story
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoryPatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Story"
        "404":
          description: Not found
    delete:
      operationId: deleteStory
      tags: [stories]
      summary: Delete a story
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /stories/by-status:
    get:
      operationId: getStoriesByStatus
      tags: [stories]
      summary: Get story counts grouped by status
      responses:
        "200":
          description: Story counts by status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatusCount"

  /stories/{id}/transition:
    post:
      operationId: transitionStory
      tags: [stories]
      summary: Validate and apply a Story lifecycle transition
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoryTransitionInput"
      responses:
        "200":
          description: Transitioned Story
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Story"
        "409":
          description: Transition blocked

  /stories/{id}/outline:
    get:
      operationId: getStoryOutline
      tags: [stories]
      summary: Get ordered Story outline
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Story outline
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StoryOutlineItem"
    put:
      operationId: replaceStoryOutline
      tags: [stories]
      summary: Atomically replace ordered Story outline
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/StoryOutlineItemInput"
      responses:
        "200":
          description: Updated outline
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StoryOutlineItem"

  /stories/{id}/links:
    get:
      operationId: getStoryLinks
      tags: [stories]
      summary: Get Story Evidence, Knowledge, Asset, Campaign, and related Story links
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Story links
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryLinks"
    post:
      operationId: linkStoryEntity
      tags: [stories]
      summary: Link an entity to a Story
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoryLinkInput"
      responses:
        "201":
          description: Link created
  /stories/{id}/links/{entityType}/{entityId}:
    delete:
      operationId: unlinkStoryEntity
      tags: [stories]
      summary: Unlink an entity from a Story
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
        - name: entityType
          in: path
          required: true
          schema:
            type: string
            enum: [evidence, knowledge, asset, campaign, story]
        - name: entityId
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Link removed

  /stories/{id}/outputs:
    get:
      operationId: getStoryOutputs
      tags: [stories]
      summary: List Story outputs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Story outputs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StoryOutput"
    post:
      operationId: createStoryOutput
      tags: [stories]
      summary: Create a Story output
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoryOutputInput"
      responses:
        "201":
          description: Created output
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryOutput"

  /stories/{id}/health:
    get:
      operationId: getStoryHealth
      tags: [stories]
      summary: Calculate explained Story health
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Story health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryHealth"

  /stories/{id}/timeline:
    get:
      operationId: getStoryTimeline
      tags: [stories]
      summary: Get Story events and version checkpoints
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Story timeline
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StoryEvent"

  /stories/{id}/archive:
    post:
      operationId: archiveStory
      tags: [stories]
      summary: Archive or restore a Story
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoryArchiveInput"
      responses:
        "200":
          description: Updated Story
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Story"

  # Campaigns
  /campaigns:
    get:
      operationId: listCampaigns
      tags: [campaigns]
      summary: List campaigns
      responses:
        "200":
          description: List of campaigns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Campaign"
    post:
      operationId: createCampaign
      tags: [campaigns]
      summary: Create a campaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"

  /campaigns/{id}:
    get:
      operationId: getCampaign
      tags: [campaigns]
      summary: Get a campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "404":
          description: Not found
    patch:
      operationId: updateCampaign
      tags: [campaigns]
      summary: Update a campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignPatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "404":
          description: Not found
    delete:
      operationId: deleteCampaign
      tags: [campaigns]
      summary: Delete a campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  # Evidence Vault
  /evidence:
    get:
      operationId: listEvidence
      tags: [evidence]
      summary: List evidence items
      parameters:
        - name: type
          in: query
          schema:
            type: string
        - name: storyId
          in: query
          schema:
            type: ["number", "null"]
        - name: projectId
          in: query
          deprecated: true
          schema:
            type: ["number", "null"]
        - name: workspaceId
          in: query
          schema:
            type: ["number", "null"]
        - name: classification
          in: query
          schema:
            $ref: "#/components/schemas/EvidenceClassification"
        - name: lifecycleStatus
          in: query
          schema:
            $ref: "#/components/schemas/EvidenceLifecycleStatus"
        - name: reviewStatus
          in: query
          schema:
            $ref: "#/components/schemas/EvidenceReviewStatus"
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of evidence
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Evidence"
    post:
      operationId: createEvidence
      tags: [evidence]
      summary: Create an evidence item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Evidence"

  /evidence/ingests:
    get:
      operationId: listRecoverableEvidenceIngests
      tags: [evidence]
      summary: List incomplete Evidence ingests for trusted restart reconciliation
      responses:
        "200":
          description: Recoverable ingests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EvidenceIngest"
    post:
      operationId: createEvidenceIngest
      tags: [evidence]
      summary: Reserve an idempotent managed-file Evidence ingest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceIngestStartInput"
      responses:
        "200":
          description: Existing idempotent ingest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceIngest"
        "201":
          description: Ingest reserved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceIngest"

  /evidence/ingests/{ingestId}/staged:
    post:
      operationId: recordEvidenceIngestStaged
      tags: [evidence]
      summary: Record streamed staging metadata
      parameters:
        - name: ingestId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceIngestStagedInput"
      responses:
        "200":
          description: Staging metadata recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceIngest"

  /evidence/ingests/{ingestId}/complete:
    post:
      operationId: completeEvidenceIngestMetadata
      tags: [evidence]
      summary: Atomically create pending Evidence and source metadata
      parameters:
        - name: ingestId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Metadata already or newly committed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceIngestResult"

  /evidence/ingests/{ingestId}/promoted:
    post:
      operationId: finalizeEvidenceIngest
      tags: [evidence]
      summary: Activate Evidence after atomic file promotion
      parameters:
        - name: ingestId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ingest completed idempotently
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceIngestResult"

  /evidence/ingests/{ingestId}/fail:
    post:
      operationId: failEvidenceIngest
      tags: [evidence]
      summary: Record a failed or compensated Evidence ingest
      parameters:
        - name: ingestId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceIngestFailureInput"
      responses:
        "200":
          description: Failure recorded idempotently
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceIngest"

  /evidence/{id}:
    get:
      operationId: getEvidence
      tags: [evidence]
      summary: Get an evidence item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Evidence item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Evidence"
        "404":
          description: Not found
    patch:
      operationId: updateEvidence
      tags: [evidence]
      summary: Optimistically update mutable Evidence metadata
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidencePatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Evidence"
        "404":
          description: Not found
        "409":
          description: Version conflict or archived Evidence
    delete:
      operationId: deleteEvidence
      tags: [evidence]
      deprecated: true
      summary: Permanent Evidence deletion is disabled; archive it instead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "409":
          description: Permanent deletion disabled
        "404":
          description: Not found

  /evidence/{id}/archive:
    post:
      operationId: archiveEvidence
      tags: [evidence]
      summary: Archive active Evidence without destroying provenance
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceVersionCommand"
      responses:
        "200":
          description: Archived Evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Evidence"
        "404": { description: Not found }
        "409": { description: Version or lifecycle conflict }

  /evidence/{id}/restore:
    post:
      operationId: restoreEvidence
      tags: [evidence]
      summary: Restore archived Evidence
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceVersionCommand"
      responses:
        "200":
          description: Restored Evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Evidence"
        "404": { description: Not found }
        "409": { description: Version or lifecycle conflict }

  /evidence/{id}/sources:
    get:
      operationId: listEvidenceSources
      tags: [evidence]
      summary: List immutable source versions for Evidence
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Ordered source versions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EvidenceSource"
        "404": { description: Not found }

  /evidence/{id}/sources/{sourceId}/locators:
    get:
      operationId: listEvidenceSourceLocators
      tags: [evidence]
      summary: List precise locators for an Evidence source version
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
        - { name: sourceId, in: path, required: true, schema: { type: number } }
      responses:
        "200":
          description: Source locators
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EvidenceSourceLocator" }
        "404": { description: Evidence source not found }
    post:
      operationId: createEvidenceSourceLocator
      tags: [evidence]
      summary: Add an immutable precise locator to active Evidence
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
        - { name: sourceId, in: path, required: true, schema: { type: number } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EvidenceSourceLocatorInput" }
      responses:
        "201":
          description: Locator created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvidenceSourceLocator" }
        "404": { description: Evidence source not found }
        "409": { description: Archived Evidence }

  /evidence/{id}/sources/{sourceId}/locators/{locatorId}:
    delete:
      operationId: deleteEvidenceSourceLocator
      tags: [evidence]
      summary: Remove a locator from active Evidence
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
        - { name: sourceId, in: path, required: true, schema: { type: number } }
        - { name: locatorId, in: path, required: true, schema: { type: number } }
      responses:
        "204": { description: Locator removed }
        "404": { description: Locator not found }
        "409": { description: Archived Evidence or locator in use }

  /evidence/{id}/stories:
    get:
      operationId: listEvidenceStoryLinks
      tags: [evidence]
      summary: List typed Story relationships for Evidence
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Evidence Story links
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EvidenceStoryLink"
        "404": { description: Not found }
    post:
      operationId: linkEvidenceToStory
      tags: [evidence]
      summary: Link active Evidence to a Story in the same Workspace
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceStoryLinkInput"
      responses:
        "201":
          description: Link created or updated idempotently
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceStoryLink"
        "404": { description: "Evidence, Story, or locator not found" }
        "409": { description: Archived entity or cross-Workspace link }

  /evidence/{id}/stories/{storyId}:
    delete:
      operationId: unlinkEvidenceFromStory
      tags: [evidence]
      summary: Remove a typed Story relationship from active Evidence
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
        - name: storyId
          in: path
          required: true
          schema: { type: number }
      responses:
        "204": { description: Link removed idempotently }
        "404": { description: Evidence not found }
        "409": { description: Archived Evidence }

  # Assets
  /assets:
    get:
      operationId: listAssets
      tags: [assets]
      summary: List assets
      parameters:
        - name: type
          in: query
          schema:
            type: string
        - name: storyId
          in: query
          schema:
            type: ["number", "null"]
      responses:
        "200":
          description: List of assets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Asset"
    post:
      operationId: createAsset
