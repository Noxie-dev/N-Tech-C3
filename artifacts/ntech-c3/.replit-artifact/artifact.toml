kind = "web"
previewPath = "/"
title = "N-Tech C³"
version = "1.0.0"
id = "artifacts/ntech-c3"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19791

[services.development]
run = "pnpm --filter @workspace/ntech-c3 run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ntech-c3", "run", "build" ]
serve = "static"
publicDir = "artifacts/ntech-c3/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19791"
BASE_PATH = "/"
